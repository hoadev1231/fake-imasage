<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f6f8">
    <meta name="description" content="Kết quả hội thoại đã dựng.">
    <title>Kết quả | Messages Studio</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/result.js" defer></script>
  </head>
  <body class="result-page">
    <main class="result-layout">
      <header class="result-toolbar">
        <a href="/" aria-label="Quay lại chỉnh sửa"><span aria-hidden="true">←</span> Chỉnh sửa</a>
        <h1>Kết quả</h1>
      </header>
      <section class="result-stage" aria-label="Hội thoại đã tạo">
        <div class="result-empty" id="result-empty" hidden>
          <h2>Chưa có hội thoại</h2>
          <p>Hãy quay lại trình chỉnh sửa để tạo bản xem trước.</p>
          <a href="/">Quay lại chỉnh sửa</a>
        </div>
        <section class="conversation" id="result-conversation" aria-label="Bản xem trước kết quả" hidden>
          <div class="status-bar" aria-label="Thanh trạng thái">
            <span id="result-time">9:41</span>
            <div class="status-icons" aria-label="Tín hiệu đầy đủ, pin">
              <span class="signal-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
              <svg class="wifi-icon" viewBox="0 0 18 14" aria-hidden="true"><path d="M1 4.5a12 12 0 0 1 16 0M4 7.5a7.5 7.5 0 0 1 10 0M7 10.5a3 3 0 0 1 4 0M9 13h.01" /></svg>
              <span class="battery" id="result-battery-icon"><span class="battery-level" id="result-battery-level"></span><span class="battery-percentage" id="result-battery-percentage">86</span></span>
            </div>
          </div>
          <header class="chat-header">
            <span class="back-button" aria-hidden="true"><span></span><b>12</b></span>
            <div class="contact">
              <div class="avatar" role="img" aria-label="Ảnh đại diện mặc định"></div>
              <div class="contact-name"><span id="result-name">+84 91 2345678</span><span class="contact-chevron" aria-hidden="true"></span></div>
            </div>
            <span class="video-button" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M15 10.5 20 7v10l-5-3.5M4 6.5h10a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z" /></svg>
            </span>
          </header>
          <div class="thread-meta"><span id="result-date">Hôm nay</span><span id="result-thread-time">09:38</span></div>
          <section class="messages" id="result-messages" aria-label="Tin nhắn"></section>
          <div class="composer result-composer" aria-hidden="true">
            <span class="add-button">+</span>
            <span class="composer-placeholder">iMessage</span>
            <span class="send-button"><svg viewBox="0 0 20 20"><path d="m10 16 0-12m0 0L5.5 8.5M10 4l4.5 4.5" /></svg></span>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
